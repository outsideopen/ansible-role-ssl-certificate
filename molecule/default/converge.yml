---
- name: 1 | Converge
  hosts: all
  become: true
  vars:
    ssl_certificate_name: kakaw
    ssl_certificate_notify:
      - Notify of change
    ssl_certificate_files_extra:
      - dest: kakaw-custom.pem
        content: kakaw
  handlers:
    - name: Notify of change
      ansible.builtin.file:
        path: /tmp/notify_was_called
        state: touch
        mode: '0644'
  roles:
    - outsideopen.ssl_certificate

- name: 2 | Converge alternate file path
  hosts: all
  become: true
  vars:
    ssl_certificate_source_path: alt
    ssl_certificate_name: circle
    ssl_certificate_path: alt
  roles:
    - outsideopen.ssl_certificate

- name: 3 | Converge combined (with ca)
  hosts: all
  become: true
  gather_facts: false
  vars:
    ssl_certificate_create_fullchain: true
    ssl_certificate_name: combined
  roles:
    - outsideopen.ssl_certificate

- name: 4 | Converge creates full chain (kakaw)
  hosts: all
  become: true
  gather_facts: false
  handlers:
    - name: Notify of change
      ansible.builtin.file:
        path: /tmp/notify_called_by_fullchain
        state: touch
        mode: '0644'
  vars:
    ssl_certificate_create_fullchain: true
    ssl_certificate_name: kakaw
    ssl_certificate_notify:
      - Notify of change
  roles:
    - outsideopen.ssl_certificate

- name: 5 | Converge combined (without ca & alternate paths & names)
  hosts: all
  become: true
  gather_facts: false
  vars:
    ssl_certificate_source_path: alt
    ssl_certificate_name: square
    ssl_certificate_path: alt
    ssl_certificate_create_fullchain: true
    ssl_certificate_source_cert_file: server.pem
    ssl_certificate_source_key_file: server.pem
    ssl_certificate_source_ca_file: ca.pem
  roles:
    - outsideopen.ssl_certificate

- name: 6 | Converge with full path
  hosts: all
  become: true
  vars:
    ssl_certificate_name: kakaw
    ssl_certificate_path_cert: /etc/custom_cert
  roles:
    - outsideopen.ssl_certificate

- name: 7 | Use specified content instead of loading from files
  hosts: all
  become: true
  vars:
    ssl_certificate_name: combined
    ssl_certificate_path_cert: /etc/custom_cert
    ssl_certificate_cert_content: "kakaw"
  roles:
    - outsideopen.ssl_certificate
